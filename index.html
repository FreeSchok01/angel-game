<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Angel-Hub Pro MMO</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --gold: #facc15;
      --purple: #a855f7;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      padding-bottom: 2rem;
    }

    header {
      background-color: var(--panel-bg);
      padding: 1rem;
      text-align: center;
      border-bottom: 2px solid var(--accent);
    }

    nav {
      display: flex;
      justify-content: flex-start;
      gap: 0.5rem;
      background: #182234;
      padding: 0.6rem;
      overflow-x: auto;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #334155;
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--accent);
      color: var(--bg-dark);
      border-color: var(--accent);
    }

    main {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: var(--panel-bg);
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .stat-gold { color: var(--gold); }
    .stat-prestige { color: var(--purple); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.8rem;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.8rem;
      text-align: center;
    }

    .btn-action {
      background: var(--accent);
      color: var(--bg-dark);
      border: none;
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 0.5rem;
    }

    .zone-card {
      background: var(--panel-bg);
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zone-card.selected { border-color: var(--accent); background: #1e3a5f; }
    .locked { opacity: 0.4; filter: grayscale(1); }
  </style>
</head>
<body>

  <header>
    <h2 style="margin:0">🎣 Twitch Angel-Hub MMO</h2>
  </header>

  <nav>
    <button class="nav-btn active" onclick="openTab('inventory')">🎒 Rucksack</button>
    <button class="nav-btn" onclick="openTab('zones')">🗺️ Gewässer</button>
    <button class="nav-btn" onclick="openTab('shop')">🏪 Shop</button>
    <button class="nav-btn" onclick="openTab('market')">⚖️ Markt</button>
    <button class="nav-btn" onclick="openTab('album')">📖 Album</button>
  </nav>

  <main>
    <div class="stats-bar">
      <div>🐥 Level: <strong id="user-level">1</strong></div>
      <div class="stat-gold">🪙 Gold: <strong id="user-gold">0</strong></div>
      <div class="stat-prestige">👑 Prestige: <strong id="user-prestige">0</strong></div>
    </div>

    <!-- TEST-STEUERUNG -->
    <button class="btn-action" style="margin-bottom: 1.2rem; background: #6366f1; color: white;" onclick="simulateCatch()">🧪 Test-Fang in aktiver Zone</button>

    <!-- TAB: RUCKSACK -->
    <div id="tab-inventory" class="tab-content active">
      <h3>Dein Inventar</h3>
      <div class="grid" id="inventory-grid"></div>
    </div>

    <!-- TAB: GEWÄSSER -->
    <div id="tab-zones" class="tab-content">
      <h3>Angel-Zonen</h3>
      <div id="zones-list"></div>
    </div>

    <!-- TAB: SHOP -->
    <div id="tab-shop" class="tab-content">
      <h3>Upgrades & Prestige</h3>
      <div class="grid">
        <div class="card">
          <div style="font-size:2rem">🎣</div>
          <h4>Ruten-Upgrade</h4>
          <p>+10% Verkaufswert</p>
          <button class="btn-action" onclick="buyUpgrade()">150 Gold</button>
        </div>
        <div class="card" style="border-color: var(--purple);">
          <div style="font-size:2rem">👑</div>
          <h4>Prestige</h4>
          <p>Ab Level 10 möglich</p>
          <button class="btn-action" style="background: var(--purple); color:white;" onclick="doPrestige()">Prestige Reset</button>
        </div>
      </div>
    </div>

    <!-- TAB: MARKTPLATZ -->
    <div id="tab-market" class="tab-content">
      <h3>Spieler-Marktplatz</h3>
      <div class="grid" id="market-grid"></div>
    </div>

    <!-- TAB: ALBUM -->
    <div id="tab-album" class="tab-content">
      <h3>Fisch-Kompendium</h3>
      <div class="grid" id="album-grid"></div>
    </div>
  </main>

  <script>
    let playerData = JSON.parse(localStorage.getItem('angel_mmo_data')) || {
      gold: 50,
      xp: 0,
      level: 1,
      prestige: 0,
      currentZone: 0,
      inventory: [],
      album: []
    };

    const ZONES = [
      { name: "Ententeich 🦆", reqLevel: 1, fishes: [{ id: "barsch", name: "Barsch", icon: "🐟", val: 10 }, { id: "schuh", name: "Schuh", icon: "👞", val: 2 }] },
      { name: "Tiefer Ozean 🌊", reqLevel: 3, fishes: [{ id: "lachs", name: "Lachs", icon: "🍣", val: 35 }, { id: "hai", name: "Hai", icon: "🦈", val: 100 }] },
      { name: "Vulkan-See 🌋", reqLevel: 5, fishes: [{ id: "drache", name: "Feuer-Aal", icon: "🐉", val: 300 }] }
    ];

    let marketOffers = [
      { id: 1, name: "Feuer-Aal", icon: "🐉", price: 250, seller: "StreamBoss" },
      { id: 2, name: "Lachs", icon: "🍣", price: 28, seller: "AnglerKing" }
    ];

    function openTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function saveData() {
      localStorage.setItem('angel_mmo_data', JSON.stringify(playerData));
      updateUI();
    }

    function updateUI() {
      document.getElementById('user-gold').innerText = playerData.gold;
      document.getElementById('user-level').innerText = playerData.level;
      document.getElementById('user-prestige').innerText = playerData.prestige;
      renderInventory();
      renderZones();
      renderMarket();
      renderAlbum();
    }

    function simulateCatch() {
      const zone = ZONES[playerData.currentZone];
      const fish = zone.fishes[Math.floor(Math.random() * zone.fishes.length)];
      
      playerData.inventory.push({...fish});
      playerData.xp += 15;

      if (!playerData.album.includes(fish.id)) playerData.album.push(fish.id);

      // Level-Up Check
      if (playerData.xp >= playerData.level * 50) {
        playerData.level += 1;
        alert(`🎉 Level Up! Du bist jetzt Level ${playerData.level}!`);
      }

      saveData();
    }

    function sellItem(index) {
      const item = playerData.inventory[index];
      const multiplier = 1 + (playerData.prestige * 0.5);
      playerData.gold += Math.round(item.val * multiplier);
      playerData.inventory.splice(index, 1);
      saveData();
    }

    function listOnMarket(index) {
      const item = playerData.inventory[index];
      const price = prompt(`Für wie viel Gold möchtest du ${item.name} auf dem Markt anbieten?`, item.val);
      if (price && !isNaN(price)) {
        marketOffers.push({ id: Date.now(), name: item.name, icon: item.icon, price: parseInt(price), seller: "Du" });
        playerData.inventory.splice(index, 1);
        saveData();
      }
    }

    function buyMarketItem(offerId) {
      const idx = marketOffers.findIndex(o => o.id === offerId);
      const offer = marketOffers[idx];
      if (playerData.gold >= offer.price) {
        playerData.gold -= offer.price;
        playerData.inventory.push({ name: offer.name, icon: offer.icon, val: offer.price });
        marketOffers.splice(idx, 1);
        saveData();
      } else {
        alert("Nicht genug Gold!");
      }
    }

    function doPrestige() {
      if (playerData.level >= 10) {
        playerData.prestige += 1;
        playerData.level = 1;
        playerData.xp = 0;
        playerData.gold = 50;
        playerData.inventory = [];
        alert("👑 Prestige durchgeführt! Du erhältst dauerhaft +50% Gold-Bonus!");
        saveData();
      } else {
        alert("Du brauchst mindestens Level 10 für Prestige!");
      }
    }

    function renderInventory() {
      const grid = document.getElementById('inventory-grid');
      if (playerData.inventory.length === 0) {
        grid.innerHTML = '<p style="color:#94a3b8">Dein Rucksack ist leer.</p>';
        return;
      }
      grid.innerHTML = playerData.inventory.map((item, idx) => `
        <div class="card">
          <div style="font-size:2rem">${item.icon}</div>
          <h4 style="margin:0.2rem 0">${item.name}</h4>
          <p style="margin:0; font-size:0.8rem">${item.val} Gold</p>
          <button class="btn-action" onclick="sellItem(${idx})">Verkaufen</button>
          <button class="btn-action" style="background:#f59e0b; color:white;" onclick="listOnMarket(${idx})">Anbieten</button>
        </div>
      `).join('');
    }

    function renderZones() {
      const list = document.getElementById('zones-list');
      list.innerHTML = ZONES.map((zone, idx) => {
        const unlocked = playerData.level >= zone.reqLevel;
        const selected = playerData.currentZone === idx;
        return `
          <div class="zone-card ${selected ? 'selected' : ''} ${unlocked ? '' : 'locked'}">
            <div>
              <h4 style="margin:0">${zone.name}</h4>
              <small>${unlocked ? 'Benötigt Level ' + zone.reqLevel : '🔒 Freischaltung ab Level ' + zone.reqLevel}</small>
            </div>
            ${unlocked ? `<button class="btn-action" style="width:auto;" onclick="selectZone(${idx})">${selected ? 'Aktiv' : 'Reisen'}</button>` : ''}
          </div>
        `;
      }).join('');
    }

    function selectZone(idx) {
      playerData.currentZone = idx;
      saveData();
    }

    function renderMarket() {
      const grid = document.getElementById('market-grid');
      grid.innerHTML = marketOffers.map(o => `
        <div class="card">
          <div style="font-size:2rem">${o.icon}</div>
          <h4 style="margin:0.2rem 0">${o.name}</h4>
          <small>Von: ${o.seller}</small>
          <p style="margin:0.3rem 0; font-weight:bold; color:var(--gold)">${o.price} Gold</p>
          ${o.seller !== "Du" ? `<button class="btn-action" onclick="buyMarketItem(${o.id})">Kaufen</button>` : '<small style="color:#94a3b8">Dein Angebot</small>'}
        </div>
      `).join('');
    }

    function renderAlbum() {
      const grid = document.getElementById('album-grid');
      const allFishes = ZONES.flatMap(z => z.fishes);
      grid.innerHTML = allFishes.map(f => {
        const unlocked = playerData.album.includes(f.id);
        return `
          <div class="card ${unlocked ? '' : 'locked'}">
            <div style="font-size:2rem">${unlocked ? f.icon : '❓'}</div>
            <h4 style="margin:0.2rem 0">${unlocked ? f.name : 'Unbekannt'}</h4>
          </div>
        `;
      }).join('');
    }

    updateUI();
  </script>
</body>
</html>
