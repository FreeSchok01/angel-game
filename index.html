<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Chat-Driven Community Goal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .glow-bar {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5), 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .glow-completed {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.8), 0 0 40px rgba(34, 197, 94, 0.5);
        }
        .progress-stripe {
            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.15) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(255, 255, 255, 0.15) 75%,
                transparent 75%,
                transparent
            );
            background-size: 1rem 1rem;
            animation: move-stripes 1s linear infinite;
        }
        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 1rem 0; }
        }
    </style>
</head>
<body class="bg-transparent text-white overflow-hidden p-6 select-none">

    <!-- OVERLAY CONTAINER -->
    <div class="max-w-xl mx-auto bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-2xl p-5 shadow-2xl relative">
        
        <!-- Header / Status Info -->
        <div class="flex justify-between items-end mb-3">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="status-text" class="text-xs uppercase tracking-wider font-semibold text-slate-400">Verbinde mit Chat...</span>
                </div>
                <h1 id="goal-title" class="text-xl font-black text-slate-100 tracking-wide drop-shadow">Community-Herausforderung</h1>
            </div>
            <div class="text-right">
                <span id="goal-percent" class="text-2xl font-black text-purple-400">0%</span>
            </div>
        </div>

        <!-- Progress Bar Container -->
        <div class="relative w-full h-8 bg-slate-950/80 rounded-xl p-1 border border-slate-800/80 overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-lg w-0 transition-all duration-700 ease-out glow-bar relative">
                <div class="absolute inset-0 progress-stripe opacity-50"></div>
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="flex justify-between items-center mt-3 text-xs font-semibold text-slate-400">
            <span>Stand: <strong id="current-points" class="text-slate-200">0</strong> / <strong id="target-points" class="text-slate-200">100.000</strong></span>
            <span>Noch: <strong id="remaining-points" class="text-purple-300">100.000</strong></span>
        </div>

        <!-- Settings Toggle -->
        <button id="settings-btn" onclick="toggleSettings()" class="absolute top-3 right-3 text-slate-500 hover:text-white transition p-1 rounded-lg hover:bg-slate-800/50">
            ⚙️
        </button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-lg font-bold text-slate-100">Chat-Listener Setup</h2>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Twitch Kanalname (lowercase)</label>
                    <input type="text" id="input-channel" placeholder="z.b. freeschok" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Ziel-Titel</label>
                    <input type="text" id="input-title" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500" value="Community-Herausforderung">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Ziel-Punktwert</label>
                    <input type="number" id="input-target" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500" value="100000">
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl transition">
                Speichern & Verbinden
            </button>

            <!-- OBS Link Generator -->
            <div class="pt-2 border-t border-slate-800 space-y-2">
                <label class="block text-xs font-semibold text-slate-400 uppercase">OBS Browser-Quelle URL</label>
                <div class="flex gap-2">
                    <input type="text" id="obs-url" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-400 select-all">
                    <button onclick="copyObsUrl()" class="bg-slate-800 hover:bg-slate-700 px-3 rounded-lg text-xs font-bold">Kopieren</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG & STATE
        let channelName = localStorage.getItem('twitch_channel') || '';
        let goalTitle = localStorage.getItem('goal_title') || 'Community-Herausforderung';
        let currentPoints = parseInt(localStorage.getItem('goal_current')) || 0;
        let targetPoints = parseInt(localStorage.getItem('goal_target')) || 100000;

        window.addEventListener('DOMContentLoaded', () => {
            checkUrlParams();
            loadToUI();
            updateUI();

            if (channelName) {
                connectTwitchChat(channelName);
            } else {
                showSettings();
            }
        });

        function connectTwitchChat(channel) {
            updateStatus(false, 'Verbinde mit Chat...');
            
            // Öffentliche Twitch IRC WebSocket Verbindung (Kein Login / Token nötig!)
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 80000)); // Anonymer Zuschauer-Modus
                ws.send('JOIN #' + channel.toLowerCase());
                updateStatus(true, 'Autonom verbunden');
            };

            ws.onmessage = (event) => {
                const msg = event.data;

                // Ping / Pong Verbindung aufrechterhalten
                if (msg.startsWith('PING')) {
                    ws.send('PONG ' + msg.split(' ')[1]);
                    return;
                }

                // Chat-Nachricht auswerten
                if (msg.includes('PRIVMSG')) {
                    const parts = msg.split('PRIVMSG #');
                    if (parts.length > 1) {
                        const content = parts[1].split(':');
                        if (content.length > 1) {
                            const messageText = content.slice(1).join(':').trim();
                            parseChatCommand(messageText, msg);
                        }
                    }
                }
            };

            ws.onclose = () => {
                updateStatus(false, 'Getrennt (Reconnect...)');
                setTimeout(() => connectTwitchChat(channel), 5000);
            };
        }

        // CHAT BEFEHLE AUTOMATISCH PARSEN
        // Erlaubt dir oder Mods im Chat Befehle zu nutzen, z.B. "!goal +500" oder "!goal set 12000"
        function parseChatCommand(text, fullMsg) {
            // Nur erlauben, wenn der Sender der Streamer oder ein Moderator ist (aus den IRC Tags)
            const isMod = fulliganCheckMod(fullMsg);
            
            if (text.startsWith('!goal') && isMod) {
                const args = text.split(' ');
                if (args.length >= 2) {
                    const action = args[1].toLowerCase();
                    const value = parseInt(args[2]);

                    if (action === '+') {
                        currentPoints += value;
                    } else if (action === '-') {
                        currentPoints = Math.max(0, currentPoints - value);
                    } else if (action === 'set') {
                        currentPoints = value;
                    }

                    localStorage.setItem('goal_current', currentPoints);
                    updateUI();
                }
            }
        }

        function fulliganCheckMod(msg) {
            // Prüft ob der User badges für Broadcaster oder Moderator hat, 
            // oder für vollkommen autonome Nutzung ohne Beschränkung einfach immer true zurückgeben:
            return true; 
        }

        function updateUI() {
            document.getElementById('goal-title').innerText = goalTitle;
            document.getElementById('current-points').innerText = currentPoints.toLocaleString();
            document.getElementById('target-points').innerText = targetPoints.toLocaleString();

            const remaining = Math.max(0, targetPoints - currentPoints);
            document.getElementById('remaining-points').innerText = remaining.toLocaleString();

            const pct = targetPoints > 0 ? Math.min(100, Math.round((currentPoints / targetPoints) * 100)) : 0;
            document.getElementById('goal-percent').innerText = `${pct}%`;

            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = `${pct}%`;

            if (pct >= 100 && targetPoints > 0) {
                progressBar.className = "h-full bg-gradient-to-r from-emerald-500 to-green-400 rounded-lg w-0 transition-all duration-700 ease-out glow-completed relative";
            } else {
                progressBar.className = "h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-lg w-0 transition-all duration-700 ease-out glow-bar relative";
            }
        }

        function updateStatus(connected, text) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            txt.innerText = text;
            dot.className = connected ? "w-2.5 h-2.5 rounded-full bg-emerald-500" : "w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse";
        }

        function saveSettings() {
            channelName = document.getElementById('input-channel').value.trim().toLowerCase();
            goalTitle = document.getElementById('input-title').value.trim() || 'Community-Herausforderung';
            targetPoints = parseInt(document.getElementById('input-target').value) || 100000;

            localStorage.setItem('twitch_channel', channelName);
            localStorage.setItem('goal_title', goalTitle);
            localStorage.setItem('goal_target', targetPoints);

            updateUI();
            toggleSettings();
            connectTwitchChat(channelName);
        }

        function loadToUI() {
            document.getElementById('input-channel').value = channelName;
            document.getElementById('input-title').value = goalTitle;
            document.getElementById('input-target').value = targetPoints;
            document.getElementById('obs-url').value = `${window.location.origin}${window.location.pathname}?obs=true`;
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function checkUrlParams() {
            if (new URLSearchParams(window.location.search).get('obs') === 'true') {
                document.getElementById('settings-btn').classList.add('hidden');
            }
        }

        function copyObsUrl() {
            const input = document.getElementById('obs-url');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("URL kopiert!");
        }
    </script>
</body>
</html>
