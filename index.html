<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Community Challenge Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .glow-bar {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5), 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .glow-completed {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.8), 0 0 40px rgba(34, 197, 94, 0.5);
        }
        .progress-stripe {
            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.15) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(255, 255, 255, 0.15) 75%,
                transparent 75%,
                transparent
            );
            background-size: 1rem 1rem;
            animation: move-stripes 1s linear infinite;
        }
        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 1rem 0; }
        }
    </style>
</head>
<body class="bg-transparent text-white overflow-hidden p-6 select-none">

    <!-- OVERLAY CONTAINER -->
    <div class="max-w-xl mx-auto bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-2xl p-5 shadow-2xl relative">
        
        <!-- Header / Status Info -->
        <div class="flex justify-between items-end mb-3">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="status-text" class="text-xs uppercase tracking-wider font-semibold text-slate-400">Warte auf Verbindung...</span>
                </div>
                <h1 id="goal-title" class="text-xl font-black text-slate-100 tracking-wide drop-shadow">Community-Herausforderung</h1>
            </div>
            <div class="text-right">
                <span id="goal-percent" class="text-2xl font-black text-purple-400">0%</span>
            </div>
        </div>

        <!-- Progress Bar Container -->
        <div class="relative w-full h-8 bg-slate-950/80 rounded-xl p-1 border border-slate-800/80 overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-lg w-0 transition-all duration-700 ease-out glow-bar relative">
                <div class="absolute inset-0 progress-stripe opacity-50"></div>
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="flex justify-between items-center mt-3 text-xs font-semibold text-slate-400">
            <span>Stand: <strong id="current-points" class="text-slate-200">0</strong> / <strong id="target-points" class="text-slate-200">0</strong></span>
            <span>Noch: <strong id="remaining-points" class="text-purple-300">0</strong></span>
        </div>

        <!-- Settings Toggle -->
        <button id="settings-btn" onclick="toggleSettings()" class="absolute top-3 right-3 text-slate-500 hover:text-white transition p-1 rounded-lg hover:bg-slate-800/50">
            ⚙️
        </button>
    </div>

    <!-- SETTINGS & AUTH MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-lg font-bold text-slate-100">Twitch Automatik Setup (cupc4k3_jenny)</h2>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>

            <!-- Login Section -->
            <div id="auth-section" class="space-y-2">
                <label class="block text-xs font-semibold text-slate-400 uppercase">Twitch Verknüpfung</label>
                <button onclick="loginTwitch()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    Mit Twitch verbinden / Autorisieren
                </button>
                <p id="user-info" class="text-xs text-slate-400 hidden">Verbunden als: <strong id="user-name" class="text-purple-400"></strong></p>
            </div>

            <!-- OBS Link Generator -->
            <div class="pt-2 border-t border-slate-800 space-y-2">
                <label class="block text-xs font-semibold text-slate-400 uppercase">OBS Browser-Quelle URL</label>
                <div class="flex gap-2">
                    <input type="text" id="obs-url" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-400 select-all">
                    <button onclick="copyObsUrl()" class="bg-slate-800 hover:bg-slate-700 px-3 rounded-lg text-xs font-bold">Kopieren</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG - WICHTIG: Trage hier deine Twitch Developer Client ID ein
        const CLIENT_ID = 'tnu1pl8bkccmz9dmkmpskd5eyw3aot';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let accessToken = localStorage.getItem('twitch_access_token') || '';
        let userId = localStorage.getItem('twitch_user_id') || '';
        let ws = null;

        let goalTitle = localStorage.getItem('challenge_title') || 'Community-Herausforderung';
        let currentPoints = parseInt(localStorage.getItem('challenge_current')) || 0;
        let targetPoints = parseInt(localStorage.getItem('challenge_target')) || 100000;

        window.addEventListener('DOMContentLoaded', () => {
            handleOAuthRedirect();
            checkUrlParams();
            loadSettingsToUI();
            updateUI();

            if (accessToken && userId) {
                initEventSubWebSocket();
            } else {
                showSettings();
            }
        });

        function handleOAuthRedirect() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');
            if (token) {
                accessToken = token;
                localStorage.setItem('twitch_access_token', token);
                window.history.replaceState({}, document.title, window.location.pathname);
                fetchUserData();
            }
        }

        function loginTwitch() {
            // Benötigter Scope für Community Challenges EventSub
            const scopes = encodeURIComponent('channel:read:challenges channel:manage:challenges');
            const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scopes}`;
            window.location.href = authUrl;
        }

        async function fetchUserData() {
            try {
                const res = await fetch('https://api.twitch.tv/helix/users', {
                    headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.json();
                if (data.data && data.data[0]) {
                    userId = data.data[0].id;
                    localStorage.setItem('twitch_user_id', userId);
                    localStorage.setItem('twitch_user_name', data.data[0].display_name);
                    document.getElementById('user-name').innerText = data.data[0].display_name;
                    document.getElementById('user-info').classList.remove('hidden');
                    initEventSubWebSocket();
                } else {
                    logout();
                }
            } catch (e) {
                console.error("Auth Error:", e);
            }
        }

        // TWITCH EVENTSUB WEBSOCKET (100% Automatisch in Echtzeit)
        function initEventSubWebSocket() {
            updateStatus(false, 'Verbinde mit EventSub...');
            ws = new WebSocket('wss://eventsub.wss.twitch.tv/ws');

            ws.onopen = () => {
                updateStatus(true, 'WebSocket bereit');
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                // Session Welcome -> Hier registrieren wir uns für die Challenge Events
                if (message.metadata.message_type === 'session_welcome') {
                    const sessionId = message.payload.session.id;
                    await subscribeToChallenges(sessionId);
                    updateStatus(true, 'Live Automatisch Verbunden');
                }

                // Push Notification bei Fortschritt oder Start der Challenge
                if (message.metadata.message_type === 'notification') {
                    const ev = message.payload.event;
                    
                    if (ev) {
                        goalTitle = ev.title || goalTitle;
                        currentPoints = ev.current_value ?? ev.current_amount ?? currentPoints;
                        targetPoints = ev.max_value ?? ev.target_amount ?? targetPoints;

                        localStorage.setItem('challenge_title', goalTitle);
                        localStorage.setItem('challenge_current', currentPoints);
                        localStorage.setItem('challenge_target', targetPoints);

                        updateUI();
                    }
                }
            };

            ws.onclose = () => {
                updateStatus(false, 'Getrennt (Reconnect...)');
                setTimeout(initEventSubWebSocket, 5000);
            };
        }

        async function subscribeToChallenges(sessionId) {
            const types = [
                'channel.community_challenge.begin',
                'channel.community_challenge.progress',
                'channel.community_challenge.end'
            ];

            for (const type of types) {
                try {
                    await fetch('https://api.twitch.tv/helix/eventsub/subscriptions', {
                        method: 'POST',
                        headers: {
                            'Client-ID': CLIENT_ID,
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            type: type,
                            version: '1',
                            condition: { broadcaster_user_id: userId },
                            transport: { method: 'websocket', session_id: sessionId }
                        })
                    });
                } catch (e) {
                    console.error("Sub Fehler für " + type, e);
                }
            }
        }

        function logout() {
            localStorage.clear();
            accessToken = '';
            userId = '';
            updateStatus(false, 'Getrennt');
            showSettings();
        }

        function updateUI() {
            document.getElementById('goal-title').innerText = goalTitle;
            document.getElementById('current-points').innerText = currentPoints.toLocaleString();
            document.getElementById('target-points').innerText = targetPoints.toLocaleString();

            const remaining = Math.max(0, targetPoints - currentPoints);
            document.getElementById('remaining-points').innerText = remaining.toLocaleString();

            const pct = targetPoints > 0 ? Math.min(100, Math.round((currentPoints / targetPoints) * 100)) : 0;
            document.getElementById('goal-percent').innerText = `${pct}%`;

            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = `${pct}%`;

            if (pct >= 100 && targetPoints > 0) {
                progressBar.className = "h-full bg-gradient-to-r from-emerald-500 to-green-400 rounded-lg w-0 transition-all duration-700 ease-out glow-completed relative";
            } else {
                progressBar.className = "h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-lg w-0 transition-all duration-700 ease-out glow-bar relative";
            }
        }

        function updateStatus(connected, text) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            txt.innerText = text;
            dot.className = connected ? "w-2.5 h-2.5 rounded-full bg-emerald-500" : "w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse";
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function showSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function loadSettingsToUI() {
            document.getElementById('obs-url').value = `${window.location.origin}${window.location.pathname}?obs=true`;
            const savedName = localStorage.getItem('twitch_user_name');
            if (savedName) {
                document.getElementById('user-name').innerText = savedName;
                document.getElementById('user-info').classList.remove('hidden');
            }
        }

        function checkUrlParams() {
            if (new URLSearchParams(window.location.search).get('obs') === 'true') {
                document.getElementById('settings-btn').classList.add('hidden');
            }
        }

        function copyObsUrl() {
            const input = document.getElementById('obs-url');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("URL kopiert!");
        }
    </script>
</body>
</html>
