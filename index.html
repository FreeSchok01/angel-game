<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Wave & Bobber Loader - Fishing Game</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
      --accent-cyan: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --purple-glow: rgba(192, 132, 252, 0.3);
      --bobber-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: var(--text-main);
    }

    /* LOADER CONTAINER */
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    /* 3D STAGE */
    .scene-3d {
      position: relative;
      width: 280px;
      height: 280px;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ISOMETRIC WAVE GRID (3D PARTICLE RINGS) */
    .wave-grid-3d {
      position: absolute;
      width: 220px;
      height: 220px;
      transform-style: preserve-3d;
      transform: rotateX(75deg) rotateZ(0deg);
      animation: gridRotate 12s infinite linear;
    }

    @keyframes gridRotate {
      0% { transform: rotateX(75deg) rotateZ(0deg); }
      100% { transform: rotateX(75deg) rotateZ(360deg); }
    }

    .particle-ring {
      position: absolute;
      inset: 0;
      margin: auto;
      border-radius: 50%;
      border: 2px dashed var(--accent-cyan);
      box-shadow: 0 0 15px var(--accent-glow), inset 0 0 15px var(--accent-glow);
      transform-style: preserve-3d;
      animation: waveFloat 3s infinite ease-in-out;
    }

    .particle-ring:nth-child(1) { width: 90px; height: 90px; animation-delay: 0s; }
    .particle-ring:nth-child(2) { width: 150px; height: 150px; animation-delay: -0.6s; }
    .particle-ring:nth-child(3) { width: 210px; height: 210px; animation-delay: -1.2s; opacity: 0.5; }

    @keyframes waveFloat {
      0%, 100% { transform: translateZ(0px) scale(0.95); opacity: 0.4; }
      50% { transform: translateZ(25px) scale(1.05); opacity: 0.9; border-color: #c084fc; box-shadow: 0 0 20px var(--purple-glow); }
    }

    /* 3D BOBBER / POSE */
    .bobber-3d-wrapper {
      position: relative;
      z-index: 10;
      transform-style: preserve-3d;
      animation: floatBobber 3s infinite ease-in-out;
    }

    @keyframes floatBobber {
      0%, 100% { transform: translateY(-18px) rotateX(10deg) rotateY(-10deg); }
      50% { transform: translateY(14px) rotateX(-15deg) rotateY(15deg); }
    }

    .bobber-body {
      width: 50px;
      height: 80px;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Top Red Cap */
    .bobber-top {
      position: absolute;
      top: 0;
      width: 50px;
      height: 40px;
      background: linear-gradient(135deg, #ff6b6b 0%, var(--bobber-red) 50%, #991b1b 100%);
      border-radius: 25px 25px 5px 5px;
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.4), 0 0 15px rgba(239, 68, 68, 0.5);
    }

    /* Bottom White Base */
    .bobber-bottom {
      position: absolute;
      bottom: 0;
      width: 50px;
      height: 40px;
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
      border-radius: 5px 5px 25px 25px;
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.3);
    }

    /* Antenna Stem */
    .bobber-antenna {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 28px;
      background: #facc15;
      border-radius: 2px;
      box-shadow: 0 0 8px #facc15;
    }

    .bobber-antenna-tip {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #ff4757;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff4757;
    }

    /* 3D DYNAMIC SHADOW ON WATER */
    .water-shadow {
      position: absolute;
      bottom: 25px;
      width: 70px;
      height: 25px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      filter: blur(8px);
      transform: rotateX(75deg);
      animation: shadowPulse 3s infinite ease-in-out;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: rotateX(75deg) scale(1.3); opacity: 0.3; }
      50% { transform: rotateX(75deg) scale(0.7); opacity: 0.8; }
    }

    /* UI TEXT & PROGRESS BAR */
    .ui-container {
      text-align: center;
      width: 300px;
    }

    .loading-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-cyan), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    .loading-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: monospace;
      margin-bottom: 1rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #facc15);
      border-radius: 20px;
      box-shadow: 0 0 12px var(--accent-cyan);
      transition: width 0.2s ease-out;
    }
  </style>
</head>
<body>

  <div class="loader-wrapper">
    <!-- 3D ANIMATION SCENE -->
    <div class="scene-3d">
      <div class="wave-grid-3d">
        <div class="particle-ring"></div>
        <div class="particle-ring"></div>
        <div class="particle-ring"></div>
      </div>

      <div class="bobber-3d-wrapper">
        <div class="bobber-body">
          <div class="bobber-antenna-tip"></div>
          <div class="bobber-antenna"></div>
          <div class="bobber-top"></div>
          <div class="bobber-bottom"></div>
        </div>
      </div>

      <div class="water-shadow"></div>
    </div>

    <!-- UI & PROGRESS BAR -->
    <div class="ui-container">
      <div class="loading-title">Gewässer Laden</div>
      <div class="loading-status" id="status-text">Synchronisiere Wellenphysik... 0%</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // SIMULATED LOADING PROGRESS
    const fill = document.getElementById('progress-fill');
    const status = document.getElementById('status-text');

    const statusMessages = [
      "Köder wird ausgeworfen...",
      "Ortung der Fischschwärme...",
      "Tiefensonar wird kalibriert...",
      "Wetterdaten werden geladen...",
      "Petri Heil! Bereit machen..."
    ];

    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 8) + 2;
      
      if (progress > 100) progress = 100;

      fill.style.width = progress + '%';
      
      const msgIndex = Math.min(
        Math.floor((progress / 100) * statusMessages.length), 
        statusMessages.length - 1
      );
      
      status.innerText = `${statusMessages[msgIndex]} ${progress}%`;

      if (progress >= 100) {
        clearInterval(interval);
      }
    }, 150);
  </script>
</body>
</html>
